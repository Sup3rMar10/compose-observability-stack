# Reference configuration: not run end to end. See README.
name: compose-observability-stack

# Shared hardening, merged into every service below.
x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  app:
    <<: *hardening
    build: ./app
    image: compose-observability-app:local
    environment:
      FAIL_RATE: "0.2"          # 20% of /work requests fail, so the error-rate panel and alert have something to show
    ports:
      - "127.0.0.1:8000:8000"   # localhost only
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks: [backend]          # internal network only, not published to the host
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_healthy

  grafana:
    <<: *hardening
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?copy .env.example to .env and set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend, frontend]
    # No read_only here: Grafana writes more places than the data volume and /tmp, and that was not checked.
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy

networks:
  backend:
    internal: true    # service to service traffic; containers only on this network have no route out
  frontend: {}        # exists so published ports on 127.0.0.1 work (an internal network cannot publish ports)

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
